name: 機能リクエスト
description: OpenSpec に追加してほしい機能を提案します。
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        解決策だけでなく、問題、影響を受ける利用者、OpenSpec が対応すべきかを知りたいと考えています。
        制限が意図した設計である場合もあるため、まず議論します。

        すべての答えを用意する必要はありません。エージェントが下書きした場合は、先に読み直してください。
        エージェントは、利用者自身のワークフローだけを根拠に提案することがあるためです。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題（1〜2 文）
      description: 何をしようとして、OpenSpec のどの点で困ったかを記入してください。解決策より先に問題を説明してください。
      placeholder: アーカイブ後に、仕様がどの変更から作られたかを確認できません。
    validations:
      required: true

  - type: textarea
    id: who
    attributes:
      label: 影響を受ける利用者
      description: 自分だけ、特定のエージェントやワークフローを使う人、すべての利用者など、影響範囲を記入してください。OpenSpec は多くのエージェントとモデルに対応しているため、変更の適否を判断する材料になります。
      placeholder: 多くの変更をアーカイブする利用者。
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 検討した代替策
      description: 試した既存のコマンド、フラグ、回避策と、それぞれで解決できなかった理由を記入してください。
    validations:
      required: false

  - type: textarea
    id: tradeoff
    attributes:
      label: 複雑さが増しても追加する価値がある理由
      description: 任意です。オプションやフラグは、多くのエージェント・モデル・ワークフローにわたり保守します。追加する価値と、必要としない利用者への負担を説明してください。
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: 提案する方法
      description: 省略して構いません。解決する価値があると合意した後に対応方法を設計するため、ここに解決策を書いても議論が早く進むわけではありません。
    validations:
      required: false
