name: リリース（準備）

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm OIDC の信頼付き公開に必要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Fission-AI/OpenSpec'
    runs-on: ubuntu-latest
    steps:
      # 先に GitHub App トークンを生成（checkout と changesets で利用）
      # これによりバージョン PR から CI ワークフローを起動できる
      # （GITHUB_TOKEN は仕様上ワークフローを起動できない）
      - name: GitHub App トークンを生成
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with: {}

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # Node 24 は OIDC に必要な npm 11.5.1+ を含む
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Version Packages PR を作成/更新（マージ時に公開）
      - name: バージョン PR を作成/更新
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore(release): version packages'
          createGithubReleases: true
          # CI 専用リリーススクリプトを使用（version PR がマージ済みであることが前提）
          # package.json には既に更新済みバージョンが入っている想定。
          publish: pnpm run release:ci
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # npm 認証は OIDC の信頼付き公開で処理（トークン不要）
